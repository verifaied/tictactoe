# GitHub Actions workflow for verifAIed: one coverage artifact for
# every package in this repository.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (backend)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install dependencies (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage (backend)
        if: always()
        working-directory: backend
        run: pytest --cov --cov-branch --cov-context=test --junit-xml=junit.xml
      - name: Emit coverage.json with per-test contexts (backend)
        if: always()
        working-directory: backend
        run: coverage json --show-contexts -o coverage.json
      - name: Run tests with coverage (frontend)
        if: always()
        working-directory: frontend
        run: pnpm exec vitest run --coverage --coverage.provider=istanbul --coverage.reporter=json --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Must match the "Coverage artifact name" in verifAIed.
          name: coverage
          path: |
            backend/coverage.json
            backend/junit.xml
            frontend/coverage/coverage-final.json
            frontend/junit.xml
          if-no-files-found: error
